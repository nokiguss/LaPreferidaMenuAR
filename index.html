<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1410">
  <title>La Preferida · Menú en 3D</title>
  <link rel="stylesheet" href="css/styles.css?v=3">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>

  <header class="encabezado">
    <h1>La Preferida</h1>
    <p>Toca un taco y míralo sobre tu mesa</p>
  </header>

  <!-- Pantalla 1: lista de tacos -->
  <main id="lista" class="lista"></main>

  <!-- Pantalla 2: visor 3D -->
  <section id="visor" class="visor" hidden>
    <button id="volver" class="volver" type="button">← Volver</button>

    <model-viewer
      id="modelo"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="auto"
      ar-placement="floor"
      camera-controls
      auto-rotate
      touch-action="pan-y"
      shadow-intensity="1"
      environment-image="neutral"
      exposure="1.05">

      <button slot="ar-button" class="boton-ar" type="button">
        📱 Ver en mi mesa
      </button>

      <!-- Nombre que se ve encima de la cámara (Android en modo navegador) -->
      <div class="etiqueta-ar" id="etiqueta-ar"></div>

      <div slot="progress-bar" class="cargando" id="cargando">Cargando…</div>
    </model-viewer>

    <h2 id="nombre" class="nombre"></h2>
    <p id="aviso" class="aviso" hidden>
      Abre esta página en tu celular para ver el taco sobre tu mesa.
    </p>
  </section>

  <script src="js/tacos.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
